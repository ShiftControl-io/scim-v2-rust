# cargo-deny configuration. Checked in CI by `.github/workflows/build.yml`.

[advisories]
# Fail on any RUSTSEC advisory affecting the resolved tree.
yanked = "deny"

[licenses]
# This crate is MIT. Only permissive licences compatible with it may appear in
# the dependency tree.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Everything must come from crates.io. A git or alternative-registry
# dependency in a published crate is a supply-chain surprise.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
