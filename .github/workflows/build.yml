name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Deny plain rustc warnings, not just clippy lints. Clippy already ran with
  # `-D warnings`, but `cargo build` and `cargo test` did not, so an unused
  # import or a deprecation in a configuration clippy does not cover could
  # reach main. Cargo passes `--cap-lints allow` to every registry dependency
  # (verified: 30 of 30), so this bounds only this crate's own code.
  RUSTFLAGS: -D warnings

# No `--locked` anywhere below: this is a library and `.gitignore` excludes
# Cargo.lock deliberately, so there is no committed lock for cargo to honour
# and `--locked` fails outright with "cannot create the lock file". The
# trade-off is intentional — CI resolves fresh dependencies on every run, so a
# breaking upstream release surfaces here rather than at a consumer.

permissions:
  contents: read

jobs:
  test:
    name: Test, lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c # v2.0.1
        with:
          rust-version: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `--all-targets` is what makes clippy see test code, and
      # `--all-features` is what makes it see the gated items. Without both,
      # a lint failure inside `#[cfg(test)]` or behind a feature reaches main.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Format
        run: cargo fmt --check
      - name: Test
        run: cargo test --all-features

      # docs.rs builds with all features; a broken intra-doc link or a
      # doctest that only compiles under the default set would otherwise ship.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

      - name: Verify generated filter parser
        run: |
          cargo install lalrpop --version 0.23.1
          lalrpop src/filter_parser.lalrpop
          git diff --exit-code src/filter_parser.rs || {
            echo "::error::src/filter_parser.rs does not match regenerated output from src/filter_parser.lalrpop"
            echo "Run 'lalrpop src/filter_parser.lalrpop' and commit the result."
            exit 1
          }

  # Every feature combination has to keep compiling and passing its own
  # tests. Without this job a reduced configuration rots within a release:
  # nothing else in CI ever builds `--no-default-features`.
  features:
    name: Feature matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - --no-default-features
          - --no-default-features --features filter
          - --no-default-features --features models
          - --no-default-features --features schemas
          - --no-default-features --features filter,models
          # `case-insensitive` with `filter` off: the only configurations in
          # which `utils::case` compiles without the filter-only vocabulary
          # its wire-name table also covers.
          - --no-default-features --features case-insensitive
          - --no-default-features --features schemas,case-insensitive
          # The shipped default set, exactly as a consumer gets it. Every other
          # row is a reduced or widened configuration, and a `cfg` interaction
          # that only shows in the default combination would otherwise be the
          # one nobody checks.
          - ""
          - --all-features
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c # v2.0.1
        with:
          rust-version: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy ${{ matrix.features }}
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - name: Test ${{ matrix.features }}
        run: cargo test ${{ matrix.features }}

  # `rust-version` in Cargo.toml is a promise. This is the only thing that
  # checks it.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(grep -m1 '^rust-version = ' Cargo.toml | cut -d'"' -f2)"
          if [ -z "$version" ]; then
            echo "::error::no rust-version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c # v2.0.1
        with:
          rust-version: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build on the declared MSRV
        run: cargo build --all-features

  # A public 1.x crate should not break its own SemVer promise by accident.
  # cargo-semver-checks compares against the last published release and
  # accounts for the version bump already declared in Cargo.toml, so an
  # intentional major bump passes.
  semver:
    name: SemVer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c # v2.0.1
        with:
          rust-version: stable
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          feature-group: all-features

  # Advisories and licences, so a vulnerable or incompatibly licensed
  # transitive dependency is caught here rather than by a consumer.
  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # `bans` included: deny.toml declares `wildcards = "deny"` and
          # `multiple-versions`, and cargo-deny only evaluates the checks named
          # here, so omitting it left both settings inert.
          command: check advisories bans licenses sources

  # Coverage, published as a Shields endpoint in a Gist — the same mechanism
  # the other ShiftControl Rust repos use. Only on push to main, because the
  # Gist secrets are not available to pull requests from forks.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c # v2.0.1
        with:
          rust-version: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      # The generated parser is 13.7k lines of LALRPOP output. Including it
      # would report coverage of a code generator, not of this crate.
      - name: Measure
        run: |
          cargo llvm-cov --all-features --lcov --output-path lcov.info \
            --ignore-filename-regex 'filter_parser\.rs'

      - name: Extract percentage
        id: cov
        run: |
          set -euo pipefail
          lf="$(grep '^LF:' lcov.info | cut -d: -f2 | awk '{s+=$1} END {print s+0}')"
          lh="$(grep '^LH:' lcov.info | cut -d: -f2 | awk '{s+=$1} END {print s+0}')"
          if [ "$lf" -eq 0 ]; then
            echo "::error::lcov.info reported zero lines; refusing to publish a 0% badge"
            exit 1
          fi
          pct="$(echo "scale=2; $lh * 100 / $lf" | bc)"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "Coverage: $pct% ($lh/$lf lines)"

      - name: Update badge Gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          CODECOV_GIST_TOKEN: ${{ secrets.CODECOV_GIST_TOKEN }}
          PCT: ${{ steps.cov.outputs.pct }}
        run: |
          set -euo pipefail
          if [ -z "${GIST_ID:-}" ] || [ -z "${CODECOV_GIST_TOKEN:-}" ]; then
            echo "::notice::GIST_ID or CODECOV_GIST_TOKEN not set; skipping badge update"
            exit 0
          fi

          color=brightgreen
          if (( $(echo "$PCT < 50" | bc -l) )); then color=red
          elif (( $(echo "$PCT < 80" | bc -l) )); then color=yellow
          fi

          json="$(printf '{"schemaVersion": 1, "label": "test coverage", "message": "%.2f%%", "color": "%s"}' "$PCT" "$color")"
          # `--fail-with-body` so an expired token surfaces. Without it curl
          # exits 0 on a 401, the job goes green, and the badge silently
          # serves its last written value for ever.
          if ! curl -sS --fail-with-body -X PATCH \
            -H "Authorization: token $CODECOV_GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"files\": {\"scim_v2_coverage.json\": {\"content\": $(echo "$json" | jq -R .)}}}" \
            "https://api.github.com/gists/$GIST_ID"; then
            echo "::error::gist PATCH failed; the coverage badge is now stale"
            exit 1
          fi
