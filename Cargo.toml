[package]
name = "scim_v2"
version = "1.0.0"
edition = "2024"
authors = ["Dan Gericke <dan@shiftcontrol.io>"]
description = "A crate that provides utilities for working with the System for Cross-domain Identity Management (SCIM) version 2.0 protocol. (rfc7642, rfc7643, rfc7644)"
documentation = "https://docs.rs/scim_v2"
license = "MIT"
repository = "https://github.com/ShiftControl-io/scim-v2-rust"
# The default feature set pulls lalrpop-util, whose entire 0.23 line declares
# rustc 1.86 — and the checked-in parser is generated by 0.23.1, so dropping to
# 0.22 would mean regenerating it. `1.85` was declared here and never checked
# by anything; the crate has not built on it since the filter parser landed.
# Without `filter` the floor is edition 2024's own 1.85.
rust-version = "1.86"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["filter", "models", "schemas", "case-insensitive"]
# RFC 7644 §3.4.2.2 filter and §3.5.2 PATCH-path parsing. Turning this off
# drops eight crates: lalrpop-util, fluent-uri, regex-automata, regex-syntax,
# aho-corasick, borrow-or-share, ref-cast and ref-cast-impl.
filter = ["dep:lalrpop-util", "dep:fluent-uri"]
# The RFC 7643 resource models and RFC 7644 protocol messages.
models = []
# The embedded RFC 7643 schema definitions and the lookups over them. Implies
# `models`, since `get_schemas` and `get_resource_types` return model types.
schemas = ["models"]

# `utils::case` — RFC 7643 §2.1 says attribute names are case-insensitive, so
# `CaseInsensitive<T>` and `utils::case::from_str` canonicalise key case before
# deserializing. Additive: it only compiles an opt-in module, so a consumer
# that never names it is unaffected however the rest of the graph is built.
# (Wire-behaviour switches such as lenient booleans or compact output are
# deliberately *not* features: Cargo unifies features across the whole
# dependency graph, so any transitive crate could flip them for everyone. They
# are types instead — see `utils::compact::Compact`.)
case-insensitive = ["models"]

# Caret requirements at major.minor. Every form here is a caret requirement —
# "1.0.228" means ">=1.0.228, <2.0.0", not a pin — and cargo always resolves to
# the newest compatible release, so the patch digit changes nothing about what
# a consumer gets. All it sets is the floor, and a floor is a claim about the
# oldest API this crate compiles against. Stating it as major.minor keeps that
# claim honest and generous; a library cannot pin (`=1.0.228` would refuse to
# unify with any other crate in the graph wanting a different patch, and a
# library's Cargo.lock is ignored by consumers).
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lalrpop-util = { version = "0.23", features = ["lexer"], optional = true }
fluent-uri = { version = "0.4", optional = true }
thiserror = "2.0"

[dev-dependencies]
proptest = "1.6"
pretty_assertions = "1.4"
test-case = "3.3"
uuid = { version = "1", features = ["serde"] }

[lib]
doc-scrape-examples = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
