[package]
name = "scim_v2"
version = "1.0.0"
edition = "2024"
authors = ["Dan Gericke <dan@shiftcontrol.io>"]
description = "A crate that provides utilities for working with the System for Cross-domain Identity Management (SCIM) version 2.0 protocol. (rfc7642, rfc7643, rfc7644)"
documentation = "https://docs.rs/scim_v2"
license = "MIT"
repository = "https://github.com/ShiftControl-io/scim-v2-rust"
# The default feature set pulls lalrpop-util, whose entire 0.23 line declares
# rustc 1.86 — and the checked-in parser is generated by 0.23.1, so dropping to
# 0.22 would mean regenerating it. `1.85` was declared here and never checked
# by anything; the crate has not built on it since the filter parser landed.
# Without `filter` the floor is edition 2024's own 1.85.
rust-version = "1.86"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# On unless a consumer sets `default-features = false`. The lists on the
# individual features below say what each one *implies*, not whether it is on.
default = ["filter", "models", "schemas"]
# RFC 7644 §3.4.2.2 filter and §3.5.2 PATCH-path parsing. Turning this off
# drops eight crates: lalrpop-util, fluent-uri, regex-automata, regex-syntax,
# aho-corasick, borrow-or-share, ref-cast and ref-cast-impl.
filter = ["dep:lalrpop-util", "dep:fluent-uri"]
# The RFC 7643 resource models and RFC 7644 protocol messages.
models = []
# The embedded RFC 7643 schema definitions and the lookups over them. Implies
# `models`, since `get_schemas` and `get_resource_types` return model types.
schemas = ["models"]


# Caret requirements at major.minor; rationale in CONTRIBUTING.md § Dependencies.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lalrpop-util = { version = "0.23", features = ["lexer"], optional = true }
fluent-uri = { version = "0.4", optional = true }
thiserror = "2.0"

[dev-dependencies]
proptest = "1.6"
pretty_assertions = "1.4"
test-case = "3.3"
uuid = { version = "1", features = ["serde"] }

[lib]
doc-scrape-examples = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
